<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Selecciona un Mundo</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="worlds-page">

  <div class="worlds-screen">
    <h1 class="worlds-title">Selecciona un Mundo</h1>

    <div class="worlds-container">
      <div class="world-item">
        <div class="world-card" data-world="egipto">
          <div class="world-overlay"></div>
        </div>
        <h2 class="world-label">Egipto</h2>
      </div>

      <div class="world-item">
        <div class="world-card" data-world="roma">
          <div class="world-overlay"></div>
        </div>
        <h2 class="world-label">Roma</h2>
      </div>

      <div class="world-item">
        <div class="world-card" data-world="selva">
          <div class="world-overlay"></div>
        </div>
        <h2 class="world-label">Selva</h2>
      </div>

      <div class="world-item">
        <div class="world-card" data-world="catacumbas">
          <div class="world-overlay"></div>
        </div>
        <h2 class="world-label">Catacumbas</h2>
      </div>
    </div>

    <div class="back-container">
      <button id="backBtn" class="menu-btn">Back</button>
    </div>
  </div>

  <script src="scripts/worlds.js"></script>
</body>
</html>
