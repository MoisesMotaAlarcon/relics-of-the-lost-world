<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Controls</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
</head>
<body class="options-page">

  <div class="overlay"></div>

  <div class="options-content">
    <h1 class="options-title">Controls</h1>

    <div class="controls-panel">

      <div class="control-row">
        <span class="control-label">Move Right</span>
        <span class="control-value">→</span>
      </div>

      <div class="control-row">
        <span class="control-label">Move Left</span>
        <span class="control-value">←</span>
      </div>

      <div class="control-row">
        <span class="control-label">Move Up</span>
        <span class="control-value">↑</span>
      </div>

      <div class="control-row">
        <span class="control-label">Move Down</span>
        <span class="control-value">↓</span>
      </div>

      <div class="control-row">
        <span class="control-label">Jump</span>
        <span class="control-value">Space</span>
      </div>

      <div class="control-row">
        <span class="control-label">Pause</span>
        <span class="control-value">P</span>
      </div>

      <div class="control-row">
        <span class="control-label">Mute</span>
        <span class="control-value">M</span>
      </div>

      <div class="control-row">
        <span class="control-label">Exit</span>
        <span class="control-value">Esc</span>
      </div>

    </div>

    <div class="menu controls-menu">
      <button id="backBtn" class="menu-btn">Back</button>
    </div>
  </div>

  <script src="scripts/controls.js"></script>
</body>
</html>
